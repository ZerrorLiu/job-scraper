version: 1
# Read AGENTS.md and docs/public/agent-development-workflow.md first.
# This file records executable local checks; repository guidance remains authoritative.

commands:
  setup: uv sync --extra dev
  format: uv run ruff format --check .
  test: uv run pytest
  lint: uv run ruff check .
  typecheck: uv run pyright

verification:
  browser: off
  security: conditional
